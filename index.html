<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forest Calculator</title>
    <link rel="stylesheet" href="style.css?v=111">
</head>
<body>

<!-- Navigation -->
<nav class="top-nav">
    <div class="nav-left">
        <button class="nav-btn" onclick="openSettings()">&#9776;</button>
        <span class="nav-title">Forest Calculator</span>
    </div>
    <div class="nav-right">
        <span class="current-player-name" id="currentPlayerName">Player 1</span>
    </div>
</nav>

<!-- Settings Panel -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <button class="settings-close" onclick="closeSettings()">&#215;</button>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="game">Game</div>
        <div class="settings-row" id="gameForest" onclick="selectGame('forest')">
            <span class="settings-label">Forest Shuffle</span>
            <span class="radio checked"></span>
        </div>
        <div class="settings-row disabled" id="gameDartmoor" onclick="selectGame('dartmoor')">
            <span class="settings-label">Dartmoor <span class="badge-soon" data-i18n="soon">Soon</span></span>
            <span class="radio"></span>
        </div>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="players">Players</div>
        <div class="settings-players" id="settingsPlayerList">
            <!-- Rendered by JS -->
        </div>
        <button class="settings-add-player" id="settingsAddPlayer" onclick="addPlayer()">
            <span class="settings-add-plus">+</span>
            <span data-i18n="addPlayer">Add Player</span>
        </button>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="language">Language</div>
        <div class="settings-lang-row">
            <button class="lang-btn" id="langEn" onclick="setLanguage('en')">&#127468;&#127463;</button>
            <button class="lang-btn" id="langNl" onclick="setLanguage('nl')">&#127475;&#127473;</button>
        </div>
    </div>

    <div class="settings-group">
        <div class="settings-group-title" data-i18n="expansions">Expansions</div>
        <div class="settings-row" id="expAlpine" onclick="toggleExpansion('alpine')">
            <span class="settings-label"><img class="symbol-icon" src="assets/symbols/alpine.png" alt="alpine"> Alpine</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row" id="expWoodlandEdge" onclick="toggleExpansion('woodlandEdge')">
            <span class="settings-label">Woodland Edge</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row" id="expExploration" onclick="toggleExpansion('exploration')">
            <span class="settings-label">Exploration</span>
            <span class="toggle"></span>
        </div>
    </div>

    <div class="settings-group" style="margin-top: 24px;">
        <button class="settings-new-game" onclick="newGame()" data-i18n="newGame">New Game</button>
    </div>

    <div class="settings-version" id="settingsVersion"></div>
</div>

<!-- Scrollable content -->
<div class="forest-scroll" id="forestScroll">

    <!-- Card sections rendered by JS -->
    <div id="cardSections"></div>

    <!-- === FOREST SUMMARY === -->
    <div class="forest-summary" id="forestSummary">
        <div class="summary-card">
            <details class="summary-details" id="summaryDetails">
                <summary class="summary-row total-row" id="summaryToggle">
                    <span class="summary-label" data-i18n="total">Total</span>
                    <span class="summary-value" id="totalPoints">0</span>
                </summary>
                <div class="summary-row">
                    <span class="summary-label" data-i18n="treePoints">Tree Points</span>
                    <span class="summary-value" id="treePoints">0</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label" data-i18n="topPoints">Top Points</span>
                    <span class="summary-value" id="topPoints">0</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label" data-i18n="bottomPoints">Bottom Points</span>
                    <span class="summary-value" id="bottomPoints">0</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label" data-i18n="sidePoints">Side Points</span>
                    <span class="summary-value" id="sidePoints">0</span>
                </div>
            </details>
        </div>
    </div>

    <div style="height: 40px;"></div>
</div>

<script src="cards.js?v=115"></script>
<script src="app.js?v=115"></script>
<script>
    // Set version from cache-busting parameter
    (function() {
        const scripts = document.getElementsByTagName('script');
        for (const s of scripts) {
            const m = s.src && s.src.match(/app\.js\?v=(\d+)/);
            if (m) {
                document.getElementById('settingsVersion').textContent = 'v0.' + m[1];
                break;
            }
        }
    })();
</script>
</body>
</html>
