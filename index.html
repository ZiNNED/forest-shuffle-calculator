<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navigation -->
<nav class="top-nav">
    <div class="nav-left">
        <button class="nav-btn" onclick="openSettings()">&#9776;</button>
        <span class="nav-title">Forest</span>
    </div>
    <div class="nav-right">
        <span class="current-player-name" id="currentPlayerName">Player 1</span>
        <button class="nav-btn" onclick="exportGame()" title="Export">&#8593;</button>
    </div>
</nav>

<!-- Settings Panel -->
<div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <span>Menu</span>
        <button class="settings-close" onclick="closeSettings()">&#215;</button>
    </div>

    <div class="settings-group">
        <div class="settings-group-title">Game</div>
        <div class="settings-row" id="gameForest" onclick="selectGame('forest')">
            <span class="settings-label">Forest Shuffle</span>
            <span class="radio checked"></span>
        </div>
        <div class="settings-row disabled" id="gameDartmoor" onclick="selectGame('dartmoor')">
            <span class="settings-label">Dartmoor <span class="badge-soon">Soon</span></span>
            <span class="radio"></span>
        </div>
    </div>

    <div class="settings-group">
        <div class="settings-group-title">Players</div>
        <div class="settings-players" id="settingsPlayerList">
            <!-- Rendered by JS -->
        </div>
        <button class="settings-add-player" id="settingsAddPlayer" onclick="addPlayer()">
            <span class="settings-add-plus">+</span>
            <span>Add Player</span>
        </button>
    </div>

    <div class="settings-group disabled">
        <div class="settings-group-title">Expansions <span class="badge-soon">Soon</span></div>
        <div class="settings-row">
            <span class="settings-label">Alpine</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Woodland Edge</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Exploration</span>
            <span class="toggle"></span>
        </div>
    </div>

    <div class="settings-group disabled">
        <div class="settings-group-title">Promos <span class="badge-soon">Soon</span></div>
        <div class="settings-row">
            <span class="settings-label">Dürer</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Hobby</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Maretak</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Spiel24</span>
            <span class="toggle"></span>
        </div>
        <div class="settings-row">
            <span class="settings-label">Elk</span>
            <span class="toggle"></span>
        </div>
    </div>

    <div class="settings-group disabled">
        <div class="settings-group-title">Scoring <span class="badge-soon">Soon</span></div>
        <div class="settings-row">
            <span class="settings-label">Distributed Scoring</span>
            <span class="toggle"></span>
        </div>
    </div>

    <div class="settings-group" style="margin-top: 24px;">
        <button class="settings-new-game" onclick="newGame()">New Game</button>
    </div>
</div>

<!-- Scrollable content -->
<div class="forest-scroll" id="forestScroll">

    <!-- Card sections rendered by JS -->
    <div id="cardSections"></div>

    <!-- === CAVE === -->
    <div class="zone-divider">
        <div class="zone-icon zi-cave">&#9675;</div>
        <span>Cave</span>
    </div>

    <div class="cave-container">
        <div class="cave-image-col">
            <img src="assets/icons/cave.png" alt="Cave" class="cave-image" onclick="addCaveCard()">
        </div>
        <div class="cave-details">
            <div class="cave-top-row">
                <span class="cave-badge" id="caveCount">0&#215;</span>
                <span class="cave-label">Cave</span>
                <button class="cave-remove-btn" id="caveRemoveBtn" onclick="removeAllCaveCards()">&#215;</button>
            </div>
            <div class="cave-card-list" id="caveCards">
            </div>
        </div>
    </div>

    <!-- === FOREST SUMMARY === -->
    <div class="forest-summary">
        <div class="summary-card">
            <div class="summary-row">
                <span class="summary-label">Tree Cards</span>
                <span class="summary-value" id="treeCardCount">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Tree Points</span>
                <span class="summary-value" id="treePoints">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Top Points</span>
                <span class="summary-value" id="topPoints">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Bottom Points</span>
                <span class="summary-value" id="bottomPoints">0</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Side Points</span>
                <span class="summary-value" id="sidePoints">0</span>
            </div>
            <div class="summary-row total-row">
                <span class="summary-label">Total</span>
                <span class="summary-value" id="totalPoints">0</span>
            </div>
        </div>
    </div>

    <div style="height: 40px;"></div>
</div>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
</html>
